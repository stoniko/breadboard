# Test lists per tier. Each test runs one design (an arm, vars/arms.yaml) on
# one scenario (data/scenarios/<scenario>.yaml) under its variants
# (vars/models.yaml). Repeats run in rounds, all tests once and then again,
# so the designs alternate.
tiers:
  # Run PR #85 on its own and evaluate the result: one RFE, start to finish,
  # through the workflow arm. check_run.py gates it on the Jira outcome, the
  # job finishing, and every model call matching the variant.
  pr85-smoke:
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: smoke-one-rfe
        # PR #85 head, feat/s1-workflow-hardening
        strat_creator_ref: 6a05210215247b287bb0fb61ed02e423c9de8692
  glm-smoke:
    # Exactly one RFE/run per selected arm. Archive/analyze S1 before S2.
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: smoke-one-rfe
      - id: S2
        arm: bash
        variants: [glm]
        scenario: smoke-one-rfe
  tier2-smoke:
    # Select exactly one design explicitly. S1 first; S2 only after analysis.
    single_test: true
    variant: haiku
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [haiku]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
      - id: S2
        arm: bash
        variants: [haiku]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
  tier2-opus:
    # A separately authorized Opus pass; the Haiku smoke tier stays unchanged.
    single_test: true
    variant: opus
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
      - id: S2
        arm: bash
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
  smoke:
    # One eligible RFE, start to finish, through each design.
    repeats: 3
    tests:
      - id: S1
        arm: workflow
        variants: [haiku]
        scenario: smoke-one-rfe
      - id: S2
        arm: bash
        variants: [haiku]
        scenario: smoke-one-rfe
      - id: S3
        arm: workflow
        variants: [opus]
        scenario: smoke-one-rfe
      - id: S4
        arm: bash
        variants: [opus]
        scenario: smoke-one-rfe
