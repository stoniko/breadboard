# Test lists per tier. Each test runs one design (an arm, vars/arms.yaml) on
# one scenario (data/scenarios/<scenario>.yaml) under its variants
# (vars/models.yaml). Repeats run in rounds, all tests once and then again,
# so the designs alternate.
tiers:
  # PR #83 against PR #85 on the same scenario: both tests run the workflow
  # arm, so the only difference is the commit. S1 is eval/pr-83 (PR #83 plus
  # the architecture-context fix, without which it would fetch an unpinned
  # tree and sparse-check out its own checkout); S2 is PR #85, which carries
  # that fix natively. Both commits are in the emulator's strat-creator copy
  # and both derive from public PR heads - unlike the eval pins elsewhere in
  # this file, they can be rebuilt from scratch.
  # single_test, as the other comparison tiers: run S1, archive it, then S2.
  pr83-vs-pr85:
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: smoke-one-rfe
        # eval/pr-83 = pr-83 (6b78355) + the architecture-context fix
        strat_creator_ref: a20bc06d583681b98ab0706674b38640f1d9c78d
      - id: S2
        arm: workflow
        variants: [glm]
        scenario: smoke-one-rfe
        # PR #85 head, feat/s1-workflow-hardening
        strat_creator_ref: 6a05210215247b287bb0fb61ed02e423c9de8692
  s1-hardening-glm:
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
        strat_creator_ref: 0e7e752702727076818001d3a29208532b40dbab
        timeout_minutes: 295
        capture_native: true
  s1-hardening-opus:
    single_test: true
    variant: opus
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
        strat_creator_ref: f3508786a1e2200731b25dfeda7e01ef772d32ce
        workflow_max_concurrent_agents: 5
        timeout_minutes: 295
        capture_native: true
  glm-smoke:
    # Exactly one RFE/run per selected arm. Archive/analyze S1 before S2.
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: smoke-one-rfe
      - id: S2
        arm: bash
        variants: [glm]
        scenario: smoke-one-rfe
  tier2-smoke:
    # Select exactly one design explicitly. S1 first; S2 only after analysis.
    single_test: true
    variant: haiku
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [haiku]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
      - id: S2
        arm: bash
        variants: [haiku]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
  tier2-opus:
    # A separately authorized Opus pass; the Haiku smoke tier stays unchanged.
    single_test: true
    variant: opus
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
      - id: S2
        arm: bash
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
  smoke:
    # One eligible RFE, start to finish, through each design.
    repeats: 3
    tests:
      - id: S1
        arm: workflow
        variants: [haiku]
        scenario: smoke-one-rfe
      - id: S2
        arm: bash
        variants: [haiku]
        scenario: smoke-one-rfe
      - id: S3
        arm: workflow
        variants: [opus]
        scenario: smoke-one-rfe
      - id: S4
        arm: bash
        variants: [opus]
        scenario: smoke-one-rfe
